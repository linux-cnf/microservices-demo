environment: prod

resources:
  requests:
    cpu: 20m
    memory: 512Mi
  limits:
    cpu: 300m
    memory: 1Gi

kibana:
  dashboardProvisioning:
    enabled: true

  serviceName: logging-prod-eck-kibana-kb-http
  namespace: logging

  dataView:
    id: kubernetes-container-logs-prod
    title: logs-kubernetes.container_logs-prod

  dashboard:
    title: Boutique Application Logs - PROD
