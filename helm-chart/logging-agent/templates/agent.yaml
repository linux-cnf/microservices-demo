apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: {{ .Values.agent.name }}
  namespace: {{ .Values.namespace }}
spec:
  version: {{ .Values.agent.version | quote }}
  mode: standalone

  elasticsearchRefs:
    - name: {{ .Values.elasticsearchRef.name }}

  kibanaRef:
    name: {{ .Values.kibanaRef.name }}

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: {{ .Values.agent.name }}
        automountServiceAccountToken: true
        dnsPolicy: ClusterFirst
        tolerations:
{{ toYaml .Values.tolerations | indent 10 }}
        containers:
          - name: agent
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: {{ .Values.resources.requests.cpu }}
                memory: {{ .Values.resources.requests.memory }}
              limits:
                cpu: {{ .Values.resources.limits.cpu }}
                memory: {{ .Values.resources.limits.memory }}
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
                readOnly: true
              - name: proc
                mountPath: /hostfs/proc
                readOnly: true
              - name: cgroup
                mountPath: /hostfs/sys/fs/cgroup
                readOnly: true

        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
              type: Directory
          - name: varlogpods
            hostPath:
              path: /var/log/pods
              type: Directory
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
              type: DirectoryOrCreate
          - name: proc
            hostPath:
              path: /proc
              type: Directory
          - name: cgroup
            hostPath:
              path: /sys/fs/cgroup
              type: Directory

  config:
    id: kubernetes-standalone
    inputs:
      - type: filestream
        id: kubernetes-container-logs
        use_output: default
        streams:
          - paths:
              - /var/log/containers/*.log
            parsers:
              - container: ~
            data_stream:
              dataset: kubernetes.container_logs
              type: logs

    providers:
      kubernetes:
        node: ${NODE_NAME}
        scope: node
        add_resource_metadata:
          namespace: true
          node: true
          deployment: true
          cronjob: true
