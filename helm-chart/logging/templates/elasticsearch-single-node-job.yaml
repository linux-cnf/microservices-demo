# -----------------------------------------------------------------------------
# PURPOSE:
# This Job configures Elasticsearch for single-node deployments in the logging
# namespace after the Elasticsearch cluster becomes available.
#
# WHAT IT DOES:
# - Creates dedicated ServiceAccount + RBAC with least-privilege access.
# - Reads Elasticsearch admin password from Kubernetes Secret securely.
# - Waits until Elasticsearch cluster health API becomes reachable.
# - Sets all Elasticsearch indices replica count to 0 for single-node mode.
# - Creates a default index template so future indices also use 0 replicas.
#
# WHY THIS IS REQUIRED:
# In a single-node Elasticsearch cluster, replicas cannot be scheduled on the
# same node, which keeps cluster health in YELLOW state by default.
# Setting number_of_replicas=0 ensures cluster health becomes GREEN.
#
# GITOPS / ARGOCD NOTES:
# - Job stays in the cluster so Argo CD does not mark it OutOfSync after TTL cleanup.
# - Executes only after Elasticsearch resources are deployed.
# - TTL cleanup is disabled so Argo CD does not see the completed Job as missing.
#
# SECURITY NOTES:
# - Uses namespace-scoped RBAC only.
# - Access is limited to reading elasticsearch-es-elastic-user Secret.
# -----------------------------------------------------------------------------
{{- if .Values.singleNodeSettingsJob.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch-single-node-settings
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elasticsearch-single-node-settings
  namespace: logging
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["elasticsearch-es-elastic-user"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elasticsearch-single-node-settings
  namespace: logging
subjects:
  - kind: ServiceAccount
    name: elasticsearch-single-node-settings
    namespace: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elasticsearch-single-node-settings
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-single-node-settings
  namespace: logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: elasticsearch-single-node-settings
      restartPolicy: OnFailure
      containers:
        - name: set-es-replicas
          # image: bitnami/kubectl:1.30
          image: bitnami/kubectl@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          command:
            - sh
            - -c
            - |
              set -eu

              ELASTIC_PASSWORD=$(kubectl get secret elasticsearch-es-elastic-user -n logging -o go-template='{{ "{{" }}.data.elastic | base64decode{{ "}}" }}')

              for i in $(seq 1 30); do
                if curl -skf -u elastic:${ELASTIC_PASSWORD} https://elasticsearch-es-http.logging.svc:9200/_cluster/health; then
                  echo "Elasticsearch is reachable"
                  break
                fi

                if [ "$i" -eq 30 ]; then
                  echo "Elasticsearch did not become ready in time"
                  exit 1
                fi

                echo "Waiting for Elasticsearch... attempt $i/30"
                sleep 10
              done

              echo "Setting existing indices replicas to 0"

              curl -skf -u elastic:${ELASTIC_PASSWORD} \
                -X PUT "https://elasticsearch-es-http.logging.svc:9200/_all/_settings?expand_wildcards=all" \
                -H "Content-Type: application/json" \
                -d '{"index":{"number_of_replicas":0}}'

              echo "Creating default single-node index template"

              curl -skf -u elastic:${ELASTIC_PASSWORD} \
                -X PUT "https://elasticsearch-es-http.logging.svc:9200/_index_template/single-node-defaults" \
                -H "Content-Type: application/json" \
                -d '{
                  "index_patterns": ["*"],
                  "template": {
                    "settings": {
                      "number_of_replicas": 0
                    }
                  },
                  "priority": 500
                }'

              echo "Elasticsearch single-node settings completed successfully"
{{- end }}
