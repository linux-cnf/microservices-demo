{{- if and .Values.grafanaDashboards.enabled .Values.grafanaDashboards.boutiqueSloGoldenSignals.enabled }}
{{- $environment := required "environment must be set through values-dev.yaml or values-prod.yaml" .Values.environment }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-slo-golden-signals-{{ $environment }}
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: grafana-dashboard
    environment: {{ $environment | quote }}
  annotations:
    grafana_folder: {{ .Values.grafanaDashboards.boutiqueSloGoldenSignals.folder | quote }}
data:
  boutique-slo-golden-signals-{{ $environment }}.json: |
{{ .Files.Get "dashboards/boutique-slo-golden-signals.json"
   | replace "__ENVIRONMENT__" $environment
   | replace "__NAMESPACE__" .Values.grafanaDashboards.boutiqueSloGoldenSignals.namespace
   | indent 4 }}
{{- end }}
