{{- if and .Values.grafanaDashboards.enabled .Values.grafanaDashboards.boutiqueTracingOverview.enabled }}
{{- $environment := required "environment must be set through values-dev.yaml or values-prod.yaml" .Values.environment }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-tracing-overview-{{ $environment }}
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: grafana-dashboard
    environment: {{ $environment | quote }}
  annotations:
    grafana_folder: {{ .Values.grafanaDashboards.boutiqueTracingOverview.folder | quote }}
data:
  boutique-tracing-overview-{{ $environment }}.json: |
{{ .Files.Get "dashboards/boutique-tracing-overview.json"
   | replace "__ENVIRONMENT__" $environment
   | replace "__NAMESPACE__" .Values.grafanaDashboards.boutiqueTracingOverview.namespace
   | indent 4 }}
{{- end }}
