#This file defines the Prometheus check. Argo Rollouts will ask Prometheus whether frontend pods are healthy before continuing the canary.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: frontend-success-rate
spec:
  metrics:
  - name: frontend-pod-availability
    interval: 30s
    count: 3
    successCondition: result[0] >= 1
    failureLimit: 1
    provider:
      prometheus:
        address: http://observability-kube-prometh-prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(kube_pod_status_ready{namespace="boutique",condition="true",pod=~"frontend-.*"})
