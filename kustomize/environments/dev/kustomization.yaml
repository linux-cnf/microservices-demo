# -------------------------------------------------------------------
# PURPOSE:
# Dev environment overlay for Online Boutique.
#
# RESPONSIBILITIES:
# - Reuse base application manifests.
# - Apply dev-only resource sizing and configuration.
#
# WHY THIS EXISTS?
# Dev should stay cheaper than prod while keeping the same deployment
# pattern for GitOps validation.
# -------------------------------------------------------------------

resources:
  - ../../base

components:
  - ../../components/container-images-registry
  - ../../components/container-images-tag
  - ../../components/service-mesh-istio
  - ../../components/istio-sidecar-resources

patches:
  - path: resourcequota-dev.yaml
