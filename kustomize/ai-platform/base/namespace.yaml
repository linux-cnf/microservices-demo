# -------------------------------------------------------------------
# PURPOSE:
# Dedicated namespace for AI platform workloads and enables Istio sidecar injection.
# Any new AI workload in this namespace automatically gets istio-proxy.
# WORKLOADS:
# - Ollama
# - vLLM
# - LLM Gateway
# - AI Agent Orchestrator
#
# DESIGN:
# Keeps AI services isolated from:
# - Boutique workloads
# - Observability stack
# - Platform services
#
# In short:
# Logical boundary for all AI platform resources.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    istio-injection: enabled
    purpose: llm
    tier: platform
    workload: ai
  name: ai
