# -------------------------------------------------------------------
# PURPOSE:
# Pull required Ollama model into the AI model cache.
#
# RESPONSIBILITIES:
# - Wait for ai-ollama service to become reachable
# - Pull the llama3.2:3b model through Ollama API
# - Make model bootstrap GitOps-managed
#
# ARGO CD:
# Runs as a PostSync hook after ai-ollama is deployed.
#
# In short:
# Ensures AI runtime has the required model after bootstrap/recreate.
# -------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-ollama-model-pull
  namespace: ai-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed

spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: ai-ollama-model-pull
        workload: ai
        tier: platform
        purpose: model-bootstrap

    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30

      nodeSelector:
        workload: ai

      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule

      containers:
        - name: ai-ollama-model-pull
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent

          env:
            - name: AI_OLLAMA_URL
              value: "http://ai-ollama.ai.svc.cluster.local:11434"
            - name: AI_MODEL_NAME
              value: "llama3.2:3b"

          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              echo "Waiting for ai-ollama..."

              OLLAMA_READY=false

              for i in $(seq 1 30); do
                if curl -sf "${AI_OLLAMA_URL}/api/tags" >/dev/null; then
                  echo "ai-ollama is reachable."
                  OLLAMA_READY=true
                  break
                fi

                echo "Attempt ${i}: ai-ollama not ready yet..."
                sleep 10
              done

              if [ "${OLLAMA_READY}" != "true" ]; then
                echo "ERROR: ai-ollama did not become reachable."
                curl -sf -X POST http://127.0.0.1:15020/quitquitquit || true
                exit 1
              fi

              if curl -sf "${AI_OLLAMA_URL}/api/tags" | grep -q "\"${AI_MODEL_NAME}\""; then
                echo "Model already present. Skipping pull."
                curl -sf -X POST http://127.0.0.1:15020/quitquitquit || true
                exit 0
              fi

              echo "Pulling model: ${AI_MODEL_NAME}"

              curl -fL --connect-timeout 30 --max-time 900 "${AI_OLLAMA_URL}/api/pull" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"${AI_MODEL_NAME}\"}"

              echo "Model pull completed."

              echo "Stopping Istio sidecar..."
              curl -sf -X POST http://127.0.0.1:15020/quitquitquit || true
