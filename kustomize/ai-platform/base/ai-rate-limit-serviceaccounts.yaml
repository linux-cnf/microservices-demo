# ---------------------------------------------------------
# PURPOSE:
# Creates dedicated ServiceAccounts for AI rate limiting.
# Improves identity-based access control between gateway and Redis.
# ---------------------------------------------------------

apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  name: ai-llm-gateway
  namespace: ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-rate-limit-redis
  namespace: ai
