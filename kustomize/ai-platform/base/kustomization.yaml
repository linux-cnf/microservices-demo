# -------------------------------------------------------------------
# PURPOSE:
# Base Kustomize entrypoint for AI platform resources.
#
# RESPONSIBILITIES:
# - Create AI and AI bootstrap namespaces
# - Deploy Ollama runtime and model cache
# - Deploy AI LLM gateway
# - Deploy AI agent orchestrator
# - Deploy AI rate-limit Redis
# - Configure RBAC
# - Configure observability resources
# - Include security layer
#
# Sync wave ordering:
# -5  Namespaces
# -4  ServiceAccounts and RBAC
# -3  PersistentVolumes
# -2  Services
# -1  Core infrastructure (Ollama, Redis)
# 0  AI workloads (Rollouts, Deployments, AnalysisTemplates)
# 1  Security policies
# 2  Observability resources
# PostSync  Model bootstrap job
#
# In short:
# Base declarative layer for the complete AI platform.
# -------------------------------------------------------------------

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana-dashboard-ai-configmap.yaml
  - ai-bootstrap-namespace.yaml
  - ai-ollama-pvc.yaml
  - ai-ollama-deployment.yaml
  - ai-ollama-service.yaml
  - ai-llm-gateway-deployment.yaml
  - ai-llm-gateway-service.yaml
  - ai-agent-orchestrator-service.yaml
  - ai-agent-orchestrator-deployment.yaml
  - ai-ollama-model-pull-job.yaml
  - ai-agent-orchestrator-serviceaccount.yaml
  - ai-agent-orchestrator-rbac.yaml
  - ai-agent-elasticsearch-rbac.yaml
  - ai-agent-productcatalog-rbac.yaml
  - ai-rate-limit-redis.yaml
  - ai-rate-limit-serviceaccounts.yaml
  - servicemonitor-ai.yaml
  - prometheusrule-ai.yaml
  - ../security
