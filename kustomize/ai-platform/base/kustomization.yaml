# -------------------------------------------------------------------
# PURPOSE:
# Base Kustomize entrypoint for AI platform resources.
#
# RESPONSIBILITIES:
# - Create namespace
# - Aggregate AI platform manifests
#
# CURRENT RESOURCES:
# - AI namespace
# - Ollama CPU runtime
# - Ollama internal service
# - Ollama model cache PVC
#
# In short:
# Root Kustomize layer for the AI platform.
# -------------------------------------------------------------------

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana-dashboard-ai-configmap.yaml
  - ai-bootstrap-namespace.yaml
  - ai-ollama-pvc.yaml
  - ai-ollama-deployment.yaml
  - ai-ollama-service.yaml
  - ai-llm-gateway-deployment.yaml
  - ai-llm-gateway-service.yaml
  - ai-agent-orchestrator-service.yaml
  - ai-agent-orchestrator-deployment.yaml
  - ai-ollama-model-pull-job.yaml
  - ai-agent-orchestrator-serviceaccount.yaml
  - ai-agent-orchestrator-rbac.yaml
  - ai-agent-elasticsearch-rbac.yaml
  - ai-agent-productcatalog-rbac.yaml
  - servicemonitor-ai.yaml
  - prometheusrule-ai.yaml
  - ../security
