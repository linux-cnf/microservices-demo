apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  name: ai-agent-orchestrator-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - events
      - namespaces
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-orchestrator-reader
subjects:
  - kind: ServiceAccount
    name: ai-agent-orchestrator
    namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agent-orchestrator-reader
