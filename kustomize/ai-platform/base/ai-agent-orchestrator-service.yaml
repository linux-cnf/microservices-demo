# -------------------------------------------------------------------
# PURPOSE:
# Internal Kubernetes service for AI Agent Orchestrator.
#
# RESPONSIBILITIES:
# - Expose agent API inside the cluster
# - Provide stable DNS for frontend/future clients
#
# ACCESS:
# Internal only:
# http://ai-agent-orchestrator.ai.svc.cluster.local:8080
#
# In short:
# Stable in-cluster endpoint for agent requests.
# -------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: ai-agent-orchestrator
  namespace: ai
  labels:
    app: ai-agent-orchestrator
    workload: ai
    tier: platform
    purpose: agent
spec:
  type: ClusterIP
  selector:
    app: ai-agent-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
