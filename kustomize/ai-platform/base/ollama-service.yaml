# -------------------------------------------------------------------
# PURPOSE:
# Internal Kubernetes service for Ollama.
#
# RESPONSIBILITIES:
# - Expose Ollama API inside the cluster
# - Provide stable DNS for LLM Gateway and AI Agent services
#
# ACCESS:
# Internal only:
# http://ollama.ai.svc.cluster.local:11434
#
# In short:
# Stable in-cluster endpoint for model inference.
# -------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
  labels:
    app: ollama
    workload: ai
    tier: platform
    purpose: llm
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
