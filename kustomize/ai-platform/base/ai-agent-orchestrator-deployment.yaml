# -------------------------------------------------------------------
# PURPOSE:
# Deploy AI Agent Orchestrator as the agent-control layer.
#
# RESPONSIBILITIES:
# - Receive /agent/chat requests
# - Add platform-specific system prompt
# - Forward request to LLM Gateway
# - Route requests to platform tools such as Prometheus, Kubernetes, and Elasticsearch
#
# DESIGN:
# Client -> AI Agent Orchestrator -> Platform Tools -> LLM Gateway -> Ollama/vLLM
#
# In short:
# Agent layer for AI-powered platform troubleshooting.
# -------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: ai-agent-orchestrator
  namespace: ai
  labels:
    app: ai-agent-orchestrator
    workload: ai
    tier: platform
    purpose: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-orchestrator
  template:
    metadata:
      labels:
        app: ai-agent-orchestrator
        workload: ai
        tier: platform
        purpose: agent
    spec:
      serviceAccountName: ai-agent-orchestrator
      nodeSelector:
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: ai-agent-orchestrator
          image: us-central1-docker.pkg.dev/project-19d98bfe-795f-49b8-af0/ai-microservices/ai-agent-orchestrator:d827c0c389ee8feb7f060afaf671017b9cc56ef1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LLM_GATEWAY_URL
              value: "http://ai-llm-gateway.ai.svc.cluster.local:8080"
            - name: PROMETHEUS_URL
              value: "http://observability-prod-kube-pr-prometheus.monitoring.svc.cluster.local:9090"
            - name: ELASTICSEARCH_URL
              value: "https://elasticsearch-es-http.logging.svc.cluster.local:9200"
            - name: ELASTICSEARCH_USERNAME
              value: "elastic"
            - name: ELASTICSEARCH_SECRET_NAMESPACE
              value: "logging"
            - name: ELASTICSEARCH_PASSWORD_SECRET_NAME
              value: "elasticsearch-es-elastic-user"
            - name: ELASTICSEARCH_PASSWORD_SECRET_KEY
              value: "elastic"
            - name: ELASTICSEARCH_CA_SECRET_NAME
              value: "elasticsearch-es-http-certs-public"
            - name: ELASTICSEARCH_CA_SECRET_KEY
              value: "ca.crt"
            - name: TEMPO_URL
              value: "http://tracing-prod-tempo.tracing.svc.cluster.local:3200"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tracing-prod-opentelemetry-collector.tracing.svc.cluster.local:4318"
            - name: PRODUCT_CATALOG_NAMESPACE
              value: "boutique"
            - name: PRODUCT_CATALOG_APP_LABEL
              value: "productcatalogservice"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
