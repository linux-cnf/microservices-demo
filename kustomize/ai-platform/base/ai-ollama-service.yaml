# -------------------------------------------------------------------
# PURPOSE:
# Internal Kubernetes service for Ollama.
#
# RESPONSIBILITIES:
# - Expose Ollama API inside the cluster
# - Provide stable DNS for LLM Gateway and AI Agent services
#
# ACCESS:
# Internal only:
# http://ai-ollama.ai.svc.cluster.local:11434
#
# In short:
# Stable in-cluster endpoint for model inference.
# -------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: ai-ollama
  namespace: ai
  labels:
    app: ai-ollama
    workload: ai
    tier: platform
    purpose: llm
spec:
  type: ClusterIP
  selector:
    app: ai-ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
