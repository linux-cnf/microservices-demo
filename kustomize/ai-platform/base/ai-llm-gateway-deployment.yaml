# -------------------------------------------------------------------
# PURPOSE:
# Deploy LLM Gateway as the controlled API layer for AI requests.
#
# RESPONSIBILITIES:
# - Receive /chat requests
# - Forward prompts to Ollama runtime
# - Hide runtime implementation from frontend and future agents
#
# DESIGN:
# Frontend/Agent -> LLM Gateway -> Ollama today
# Frontend/Agent -> LLM Gateway -> vLLM later
#
# In short:
# Stable abstraction layer for all LLM traffic.
# -------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-llm-gateway
  namespace: ai
  labels:
    app: ai-llm-gateway
    workload: ai
    tier: platform
    purpose: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-llm-gateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
      labels:
        app: ai-llm-gateway
        workload: ai
        tier: platform
        purpose: gateway
    spec:
      serviceAccountName: ai-llm-gateway
      nodeSelector:
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: ai-llm-gateway
          image: us-central1-docker.pkg.dev/project-19d98bfe-795f-49b8-af0/ai-microservices/ai-llm-gateway:bb72a318d72c8dd4c4cc90573b4303e1c2e01916
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OLLAMA_URL
              value: "http://ai-ollama.ai.svc.cluster.local:11434"
            - name: DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-model-config
                  key: AI_MODEL
            - name: OLLAMA_REQUEST_TIMEOUT_SECONDS
              value: "300"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tracing-prod-opentelemetry-collector.tracing.svc.cluster.local:4318"
            - name: RATE_LIMIT_REQUESTS
              value: "30"
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: REDIS_URL
              value: "redis://ai-rate-limit-redis.ai.svc.cluster.local:6379/0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
