# -------------------------------------------------------------------
# PURPOSE:
# Enables Prometheus Operator to scrape AI service metrics automatically.
# Collects /metrics from AI workloads for monitoring, dashboards, and alerts.
# -------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: ai-platform-servicemonitor
  namespace: ai
  labels:
    release: observability
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ai-llm-gateway
          - ai-agent-orchestrator
  namespaceSelector:
    matchNames:
      - ai
  endpoints:
    - port: http-metrics
      path: /stats/prometheus
      interval: 30s
