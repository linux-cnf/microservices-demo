apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: ai-ollama-allow-model-bootstrap
  namespace: ai
spec:
  selector:
    matchLabels:
      app: ai-ollama
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - ai-bootstrap
      to:
        - operation:
            ports:
              - "11434"
