# ---------------------------------------------------------
# PURPOSE:
# Enforces STRICT mTLS for all workloads in the AI namespace.
# ---------------------------------------------------------

apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: ai-strict-mtls
  namespace: ai
spec:
  mtls:
    mode: STRICT
