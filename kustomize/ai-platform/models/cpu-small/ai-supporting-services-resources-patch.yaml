apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-llm-gateway
  namespace: ai
spec:
  template:
    spec:
      containers:
        - name: ai-llm-gateway
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-orchestrator
  namespace: ai
spec:
  template:
    spec:
      containers:
        - name: ai-agent-orchestrator
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-rate-limit-redis
  namespace: ai
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
