# -------------------------------------------------------------------
# PURPOSE:
# Kustomize entrypoint for AI canary deployments.
#
# SHORT NOTES:
# - Imports base AI platform resources.
# - Deletes normal ai-llm-gateway Deployment.
# - Adds ai-llm-gateway Rollout and AnalysisTemplate.
# -------------------------------------------------------------------

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - ai-llm-gateway-rollout.yaml
  - ai-llm-gateway-analysis-template.yaml

patches:
  - path: delete-ai-llm-gateway-deployment.yaml
