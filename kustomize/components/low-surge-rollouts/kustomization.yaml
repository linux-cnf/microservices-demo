# Reduce rollout surge so Istio sidecar-enabled pods can roll on small clusters.
# Deletes one old pod before creating a new one to avoid extra CPU scheduling pressure.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
