# Istio Gateway for exposing boutique frontend through istio-ingressgateway.
# This uses classic Istio Gateway instead of Kubernetes Gateway API to avoid GatewayClass dependency in CI.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: frontend-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
# Routes external HTTP traffic from frontend-gateway to the frontend service.
# This makes http://<istio-ingressgateway-ip> reach the boutique frontend.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-ingress
spec:
  hosts:
    - "*"
  gateways:
    - frontend-gateway
  http:
    - route:
        - destination:
            host: frontend
            port:
              number: 80
