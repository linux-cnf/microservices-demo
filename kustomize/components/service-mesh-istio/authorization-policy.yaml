# Istio AuthorizationPolicy for boutique namespace.
# Allows internal boutique-to-boutique service traffic and external traffic coming through Istio ingressgateway.
# Without the ingressgateway rule, browser/curl traffic to frontend gets blocked with 403.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: boutique-allow-same-namespace
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - boutique
    - from:
        - source:
            namespaces:
              - istio-system
