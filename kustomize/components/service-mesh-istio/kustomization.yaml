# Enables Istio traffic-management and security resources for the boutique application.
# Includes egress rules, Gateway API routing, mTLS, and mesh metrics.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - allow-egress-googleapis.yaml
  - frontend-gateway.yaml
  - frontend.yaml
  - mtls.yaml
  - istio-podmonitor.yaml
