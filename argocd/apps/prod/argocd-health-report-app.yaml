apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-health-report-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/linux-cnf/microservices-demo.git
    targetRevision: main
    path: argocd/apps/prod/argocd-health-report
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
