apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-rollouts

resources:
  - namespace.yaml
  - https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
  - argo-rollouts-pdb.yaml

patches:
  - path: argo-rollouts-ha-patch.yaml
    target:
      kind: Deployment
      name: argo-rollouts
