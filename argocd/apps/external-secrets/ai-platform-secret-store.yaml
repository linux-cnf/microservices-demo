# PURPOSE:
# Provides the AI Platform namespace with access to GCP Secret Manager
# through External Secrets Operator using Workload Identity.
#
# FUTURE USE CASES:
# OpenAI API keys, Gemini API keys, GitHub tokens, Slack tokens,
# Tempo credentials, Product Catalog API credentials, etc.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: ai
spec:
  provider:
    gcpsm:
      projectID: project-19d98bfe-795f-49b8-af0
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: kfounding
          serviceAccountRef:
            name: argocd-external-secrets
