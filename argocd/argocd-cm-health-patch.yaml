apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""

    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end

    return hs

  resource.customizations.health.elasticsearch.k8s.elastic.co_Elasticsearch: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for Elasticsearch health"

    if obj.status ~= nil then
      if obj.status.health == "green" then
        hs.status = "Healthy"
        hs.message = "Elasticsearch cluster health is green"
        return hs
      end

      if obj.status.health == "yellow" then
        hs.status = "Healthy"
        hs.message = "Elasticsearch cluster health is yellow but accepted for test single-node environment"
        return hs
      end

      if obj.status.health == "red" then
        hs.status = "Degraded"
        hs.message = "Elasticsearch cluster health is red"
        return hs
      end
    end

    return hs

  resource.customizations.health.external-secrets.io_ExternalSecret: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for ExternalSecret"

    if obj.status ~= nil and obj.status.conditions ~= nil then
      for i, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" and condition.status == "True" then
          hs.status = "Healthy"
          hs.message = "ExternalSecret is ready"
          return hs
        end

        if condition.type == "Ready" and condition.status == "False" then
          hs.status = "Degraded"
          if condition.message ~= nil then
            hs.message = condition.message
          else
            hs.message = "ExternalSecret is not ready"
          end
          return hs
        end
      end
    end

    return hs

  resource.customizations.health.monitoring.coreos.com_Prometheus: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for Prometheus"

    if obj.status ~= nil then
      if obj.status.availableReplicas ~= nil and obj.status.availableReplicas >= 1 then
        hs.status = "Healthy"
        hs.message = "Prometheus is available"
        return hs
      end
    end

    return hs

  resource.customizations.health.monitoring.coreos.com_ServiceMonitor: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "ServiceMonitor exists"
    return hs
