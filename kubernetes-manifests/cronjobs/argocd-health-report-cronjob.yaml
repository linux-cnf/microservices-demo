apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-health-reporter
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-health-reporter
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-health-reporter
subjects:
- kind: ServiceAccount
  name: argocd-health-reporter
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-health-reporter
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-health-report
  namespace: argocd
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: argocd-health-reporter
          restartPolicy: Never
          containers:
          - name: argocd-health-report
            image: bitnami/kubectl:latest
            env:
            - name: SLACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-notifications-secret
                  key: slack-token
            command:
            - /bin/sh
            - -c
            - |
              REPORT=$(kubectl get applications -A)

              curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                -H "Content-type: application/json" \
                --data "$(printf '{"channel":"argocd-alerts","text":"*ArgoCD Application Report - Every 2 Hours*\n```%s```"}' "$REPORT")"
