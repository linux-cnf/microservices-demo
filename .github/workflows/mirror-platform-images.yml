# NOTE:
# This workflow mirrors approved third-party/platform container images into
# private Google Artifact Registry repositories used by the cluster.
#
# Purpose:
# - Seed platform/observability images.
# - Seed required third-party application images such as Redis.
# - Avoid direct public image pulls from private GKE nodes.
# - Improve reliability for private/restricted clusters.
# - Support environments running without Cloud NAT/public internet access.
#
# Image inventories:
# - terraform/live/prod/artifact_registry_seed_platform_images.txt
# - terraform/live/prod/artifact_registry_seed_images.txt
#
# Mirroring logic:
# ./scripts/mirror-platform-images.sh -n "${{ inputs.environment }}"
#
# Flow:
# approved external images -> internal Artifact Registry mirror
# -> GKE pulls trusted private images only.
name: mirror-platform-images

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: "prod"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to mirror images for"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
          - shared

  push:
    branches: [main]
    paths:
      - "terraform/live/prod/artifact_registry_seed_platform_images.txt"
      - "terraform/live/prod/artifact_registry_seed_images.txt"
      - "scripts/mirror-platform-images.sh"
      - ".github/workflows/mirror-platform-images.yml"

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Mirror required images
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          chmod +x scripts/mirror-platform-images.sh
          ./scripts/mirror-platform-images.sh -n "$TARGET_ENVIRONMENT"
