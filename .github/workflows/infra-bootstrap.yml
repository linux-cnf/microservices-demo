name: infra-bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'argocd/**'
      - '.github/workflows/infra-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get cluster credentials
        run: |
          gcloud container clusters get-credentials kfounding \
            --zone us-central1-a \
            --project project-9e0b2bd9-4649-487c-9d1

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      - name: Wait for Argo CD
        run: |
          kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=600s
          kubectl wait --for=condition=Available deployment/argocd-repo-server -n argocd --timeout=600s

      - name: Bootstrap Argo CD app
        run: |
          kubectl apply -f argocd/boutique-app.yaml
