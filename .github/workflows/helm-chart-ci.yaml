name: helm-chart-ci

on:
  push:
    branches:
      - main
    paths:
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-ci.yaml'
  pull_request:
    paths:
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-ci.yaml'

jobs:
  helm-chart-ci:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart:
          - helm-chart/logging-agent
          - helm-chart/logging
          - helm-chart/observability

    steps:
      - uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: |
          if [ -f "${{ matrix.chart }}/Chart.lock" ]; then
            helm dependency build "${{ matrix.chart }}"
          fi

      - name: Helm lint
        run: |
          helm lint --strict "${{ matrix.chart }}"

      - name: Helm template
        run: |
          helm template "$(basename "${{ matrix.chart }}")" "${{ matrix.chart }}" > rendered.yaml
          cat rendered.yaml
