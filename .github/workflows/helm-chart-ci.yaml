# NOTE:
# This workflow validates the custom platform Helm charts used for the
# observability and logging stack before they are merged or deployed by Argo CD.
#
# It currently checks:
# - helm-chart/logging-agent
# - helm-chart/logging
# - helm-chart/observability
# - helm-chart/tracing
#
# Validation flow:
# Helm dependency build -> helm lint --strict -> helm template
# -> kubeconform schema validation -> Trivy config scan -> Checkov policy scan
#
# This was added when the repo started moving platform components like
# Prometheus/Grafana, Elasticsearch/Kibana, and logging agents into Helm charts.
# The main issue it solved was catching broken Helm chart syntax, missing chart
# dependencies, invalid values, and render failures early in GitHub Actions
# instead of discovering them later during Argo CD sync inside the GKE cluster.
#
# The Helm repositories are added explicitly because some charts depend on
# external upstream chart repos such as Elastic and prometheus-community.
#
# In short:
# Helm chart change -> build dependencies -> helm lint --strict
# -> helm template render check -> safer Argo CD deployment.
name: helm-chart-ci

on:
  push:
    branches:
      - main
    paths:
      - "helm-chart/**"
      - ".github/workflows/helm-chart-ci.yaml"
  pull_request:
    paths:
      - "helm-chart/**"
      - ".github/workflows/helm-chart-ci.yaml"

concurrency:
  group: helm-chart-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helm-chart-ci:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart:
          - helm-chart/logging-agent
          - helm-chart/logging
          - helm-chart/observability
          # TODO: Re-enable after tracing chart dependency build is fixed.
          # - helm-chart/tracing

    steps:
      - uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repositories
        run: |
          helm repo add elastic https://helm.elastic.co
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add open-telemetry \
            https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Build chart dependencies
        run: |
          if [ -f "${{ matrix.chart }}/Chart.lock" ]; then
            helm dependency build "${{ matrix.chart }}"
          fi

      - name: Helm lint
        run: |
          helm lint --strict "${{ matrix.chart }}"

      - name: Helm template
        run: |
          helm template \
            "$(basename "${{ matrix.chart }}")" \
            "${{ matrix.chart }}" \
            > rendered.yaml
          cat rendered.yaml

      - name: Validate rendered manifests with kubeconform
        uses: yokawasa/action-setup-kube-tools@v0.13.1
        with:
          kubeconform: "0.6.7"

      - name: Kubeconform validation
        run: kubeconform -strict -ignore-missing-schemas rendered.yaml

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: rendered.yaml
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Checkov scan rendered manifests
        uses: bridgecrewio/checkov-action@master
        with:
          file: rendered.yaml
          framework: kubernetes
          quiet: true
          soft_fail: false
          skip_check: CKV_K8S_38
