name: kubevious-manifests-ci

on:
  push:
    branches:
      - main
    paths:
      - "helm-chart/**"
      - "kustomize/**"
      - "kubernetes-manifests/**"
      - ".github/workflows/kubevious-manifests-ci.yaml"
  pull_request:
    paths:
      - "helm-chart/**"
      - "kustomize/**"
      - "kubernetes-manifests/**"
      - ".github/workflows/kubevious-manifests-ci.yaml"

permissions:
  contents: read

jobs:
  kubevious-kubernetes-manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Validate kubernetes-manifests
        uses: kubevious/cli@v1.0.64
        with:
          manifests: kubernetes-manifests
          other_args: "--skip-rules container-latest-image --skip-rules unknown-property"

  kubevious-kustomize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Validate kustomize
        uses: kubevious/cli@v1.0.64
        with:
          manifests: kustomize
          ignore_unknown: true
          other_args: "--skip-rules container-latest-image --skip-rules unknown-property"

  kubevious-helm-charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        chart:
          - helm-chart/logging-agent
          - helm-chart/logging

    steps:
      - uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repositories
        run: |
          helm repo add elastic https://helm.elastic.co
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Build chart dependencies
        run: |
          if [ -f "${{ matrix.chart }}/Chart.lock" ]; then
            helm dependency build "${{ matrix.chart }}"
          fi

      - name: Validate Helm chart
        uses: kubevious/cli@v1.0.64
        with:
          manifests: ${{ matrix.chart }}
          ignore_unknown: true
          skip_rules: service-selector-ref
