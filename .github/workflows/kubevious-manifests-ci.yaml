name: kubevious-manifests-ci

on:
  push:
    branches:
      - main
    paths:
      - 'helm-chart/**'
      - 'kustomize/**'
      - '.github/workflows/kubevious-manifests-ci.yaml'
  pull_request:
    paths:
      - 'helm-chart/**'
      - 'kustomize/**'
      - '.github/workflows/kubevious-manifests-ci.yaml'

permissions:
  contents: read

jobs:
  kubevious-kubernetes-manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Validate kubernetes-manifests
        uses: kubevious/cli@v1.0.64
        with:
          manifests: kubernetes-manifests
          skip_rules: container-latest-image

  kubevious-kustomize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Validate kustomize
        uses: kubevious/cli@v1.0.64
        with:
          manifests: kustomize
          skip_rules: container-latest-image

  kubevious-helm-charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        chart:
          - helm-chart/logging-agent
          - helm-chart/logging
          - helm-chart/observability

    steps:
      - uses: actions/checkout@v6

      - name: Validate Helm chart
        uses: kubevious/cli@v1.0.64
        with:
          manifests: ${{ matrix.chart }}
