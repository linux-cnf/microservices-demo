# -------------------------------------------------------------------
# PURPOSE:
# On-demand bootstrap workflow for the AI platform infrastructure.
#
# RESPONSIBILITIES:
# - Enable the dedicated AI node pool using Terraform
# - Validate that AI nodes are created with correct labels and taints
# - Keep AI infrastructure separate from normal platform bootstrap
#
# WHY THIS EXISTS?
# AI/LLM workloads can be expensive and resource-heavy.
# This workflow allows the AI platform to be enabled only when needed
# for testing, demos, or future AI agent deployments.
#
# CURRENT SCOPE:
# Phase 3 v1 provisions only AI infrastructure.
# It does not deploy LLM Gateway, AI Agents, Ollama, or vLLM yet.
#
# FUTURE FLOW:
# ai-platform-bootstrap
#   ├── enable AI node pool
#   ├── deploy AI namespace
#   ├── deploy LLM Gateway
#   ├── deploy AI Agent Orchestrator
#   ├── deploy Ollama/vLLM
#   └── run AI smoke tests
# -------------------------------------------------------------------

name: ai-platform-bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for AI node pool"
        required: true
        default: "prod"
        type: choice
        options:
          - prod

      run_apply:
        description: "Run terraform apply to enable AI node pool?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      ai_profile:
        description: "AI hardware/model profile"
        required: true
        default: "cpu-small"
        type: choice
        options:
          - cpu-small
          - cpu-better

  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: "prod"

      run_apply:
        description: "Run terraform apply to enable AI node pool?"
        required: false
        default: true
        type: boolean

      ai_profile:
        required: false
        type: string
        default: "cpu-small"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-live-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ai-infra:
    runs-on: ubuntu-latest

    env:
      TF_INPUT: "false"
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      SELECTED_ENVIRONMENT: ${{ inputs.environment }}
      TERRAFORM_WORKING_DIR: terraform/live/${{ inputs.environment }}
      CLUSTER_NAME: kfounding-prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud auth list
          gcloud config list
          gcloud projects describe "${{ secrets.GCP_PROJECT_ID }}" --format="value(projectNumber)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform init

      - name: Import existing AI node pool service account if present
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          AI_NODE_POOL_SA_RESOURCE="module.ai_node_pool_service_account.google_service_account.service_account"
          AI_NODE_POOL_SA_ID="projects/${PROJECT_ID}/serviceAccounts/gke-ai-node-pool-sa@${PROJECT_ID}.iam.gserviceaccount.com"

          if gcloud iam service-accounts describe "gke-ai-node-pool-sa@${PROJECT_ID}.iam.gserviceaccount.com" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            if terraform state show "${AI_NODE_POOL_SA_RESOURCE}" >/dev/null 2>&1; then
              echo "AI node pool service account already exists in Terraform state."
            else
              echo "Importing existing AI node pool service account into Terraform state..."
              terraform import "${AI_NODE_POOL_SA_RESOURCE}" "${AI_NODE_POOL_SA_ID}"
            fi
          else
            echo "AI node pool service account does not exist yet. Terraform will create it."
          fi

      - name: Terraform fmt check
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform validate

      - name: Select AI profile
        env:
          AI_PROFILE: ${{ inputs.ai_profile }}
        run: |
          set -euo pipefail

          case "${AI_PROFILE}" in
            cpu-better)
              echo "AI_MACHINE_TYPE=e2-highmem-4" >> "$GITHUB_ENV"
              echo "AI_MODEL=llama3.2:3b" >> "$GITHUB_ENV"
              ;;
            cpu-small)
              echo "AI_MACHINE_TYPE=e2-standard-2" >> "$GITHUB_ENV"
              echo "AI_MODEL=tinyllama" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Invalid AI profile: ${AI_PROFILE}"
              exit 1
              ;;
          esac

      - name: Terraform plan AI platform
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform plan -input=false \
          -var="enable_ai_node_pool=true" \
          -var="ai_node_pool_machine_type=${AI_MACHINE_TYPE}" \
          -out=tfplan-ai

      - name: Terraform apply AI platform
        if: ${{ inputs.run_apply == true || inputs.run_apply == 'true' }}
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan-ai

      - name: Get GKE credentials
        if: ${{ inputs.run_apply == true || inputs.run_apply == 'true' }}
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: kfounding-prod
          location: us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify AI node pool
        if: ${{ inputs.run_apply == true || inputs.run_apply == 'true' }}
        run: |
          set -euo pipefail

          echo "Checking AI node pool from GCP API..."
          gcloud container node-pools list \
            --cluster "${CLUSTER_NAME}" \
            --region us-central1

          echo ""
          echo "Verifying ai-node-pool exists..."
          gcloud container node-pools describe ai-node-pool \
            --cluster "${CLUSTER_NAME}" \
            --region us-central1 \
            --format="table(name,config.machineType,config.diskSizeGb,status)"

          echo ""
          echo "✅ AI node pool exists."
          echo ""
          echo "NOTE:"
          echo "Kubernetes node label/taint verification is skipped in GitHub Actions"
          echo "because the GKE control plane is reachable only from bastion/whitelisted IPs."
          echo ""
          echo "Run this from bastion after this workflow:"
          echo "  ./scripts/ai-cluster-bootstrap.sh"

      - name: AI platform bootstrap completion message
        if: ${{ inputs.run_apply == true || inputs.run_apply == 'true' }}
        run: |
          echo "✅ AI platform infrastructure bootstrap completed."
          echo ""
          echo "Dedicated AI node pool has been provisioned and verified."
          echo ""
          echo "AI workload scheduling contract:"
          echo "  nodeSelector:"
          echo "    workload: ai"
          echo "    purpose: llm"
          echo ""
          echo "  tolerations:"
          echo "    - key: workload"
          echo "      operator: Equal"
          echo "      value: ai"
          echo "      effect: NoSchedule"
          echo ""
          echo "Next step:"
          echo "Deploy AI platform components such as LLM Gateway, AI Agent Orchestrator, Ollama, or vLLM through Argo CD."
          echo "Run ./scripts/ai-cluster-bootstrap.sh from bastion/whitelisted machine."
