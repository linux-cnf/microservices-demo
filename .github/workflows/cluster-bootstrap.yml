# NOTE:
# Cluster bootstrap is intentionally executed from the bastion host using
# scripts/cluster-bootstrap.sh instead of a dedicated GitHub Actions cluster
# pipeline/runners. This approach keeps the setup simple and avoids additional
# always-running/self-hosted runner infrastructure cost for cluster-level
# kubectl and Argo CD bootstrap operations.
name: cluster-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cluster-bootstrap-kfounding
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, bastion]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get cluster credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: kfounding
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify kubectl access
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argocd \
            -f argocd/install.yaml

      - name: Wait for Argo CD
        run: |
          kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=600s
          kubectl wait --for=condition=Available deployment/argocd-repo-server -n argocd --timeout=600s

      - name: Validate Argo CD repo secrets
        env:
          ARGOCD_REPO_URL: ${{ secrets.ARGOCD_REPO_URL }}
          ARGOCD_REPO_USERNAME: ${{ secrets.ARGOCD_REPO_USERNAME }}
          ARGOCD_REPO_PASSWORD: ${{ secrets.ARGOCD_REPO_PASSWORD }}
        run: |
          test -n "$ARGOCD_REPO_URL"
          test -n "$ARGOCD_REPO_USERNAME"
          test -n "$ARGOCD_REPO_PASSWORD"
          echo "Argo CD repo secrets are present"

      - name: Create Argo CD repository secret
        env:
          ARGOCD_REPO_URL: ${{ secrets.ARGOCD_REPO_URL }}
          ARGOCD_REPO_USERNAME: ${{ secrets.ARGOCD_REPO_USERNAME }}
          ARGOCD_REPO_PASSWORD: ${{ secrets.ARGOCD_REPO_PASSWORD }}
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: repo-microservices-demo
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          type: Opaque
          stringData:
            type: git
            url: ${ARGOCD_REPO_URL}
            username: ${ARGOCD_REPO_USERNAME}
            password: ${ARGOCD_REPO_PASSWORD}
          EOF

      - name: Bootstrap Argo CD root app
        run: |
          set -euo pipefail

          echo "Applying Argo CD root app..."
          kubectl apply -f argocd/platform-root-app.yaml -n argocd

          echo "Waiting for root app to appear..."
          kubectl wait --for=jsonpath='{.metadata.name}'=platform-root \
            application/platform-root -n argocd --timeout=120s || true

          kubectl get application -n argocd
