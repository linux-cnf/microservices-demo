# NOTE:
# Cluster bootstrap is intentionally executed from the bastion host using
# a self-hosted GitHub Actions runner because the GKE control plane is
# restricted by master authorized networks.
#
# This workflow performs only cluster-level bootstrap:
# - gets GKE credentials
# - installs Argo CD
# - applies Argo CD core config
# - applies the app-of-apps root application
#
# Child applications are managed by argocd/platform-root-app.yaml.
name: cluster-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cluster-bootstrap-kfounding
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, bastion]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get cluster credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: kfounding
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify kubectl access
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Install Argo CD
        run: |
          set -euo pipefail

          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply --server-side --force-conflicts -n argocd \
            -f argocd/install.yaml

      - name: Wait for Argo CD
        run: |
          set -euo pipefail

          kubectl wait --for=condition=Available deployment/argocd-server \
            -n argocd --timeout=600s

          kubectl wait --for=condition=Available deployment/argocd-repo-server \
            -n argocd --timeout=600s

      - name: Apply Argo CD core config
        run: |
          set -euo pipefail

          echo "Applying Argo CD custom health checks..."
          kubectl apply -f argocd/argocd-cm-health-patch.yaml -n argocd

          echo "Applying Argo CD notifications config..."
          kubectl apply -f argocd/argocd-notifications-cm.yaml -n argocd

      - name: Restart Argo CD components
        run: |
          set -euo pipefail

          kubectl rollout restart deployment/argocd-server -n argocd
          kubectl rollout restart deployment/argocd-repo-server -n argocd
          kubectl rollout restart deployment/argocd-notifications-controller -n argocd
          kubectl rollout restart statefulset/argocd-application-controller -n argocd

          kubectl rollout status deployment/argocd-server \
            -n argocd --timeout=300s

          kubectl rollout status deployment/argocd-repo-server \
            -n argocd --timeout=300s

          kubectl rollout status deployment/argocd-notifications-controller \
            -n argocd --timeout=300s

          kubectl rollout status statefulset/argocd-application-controller \
            -n argocd --timeout=300s

      - name: Bootstrap Argo CD root app
        run: |
          set -euo pipefail

          echo "Applying Argo CD root app..."
          kubectl apply -f argocd/platform-root-app.yaml -n argocd

          echo "Waiting for platform-root application to be created..."
          kubectl wait --for=jsonpath='{.metadata.name}'=platform-root \
            application/platform-root -n argocd --timeout=120s || true

          echo "Waiting for platform-root to sync..."
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced \
            application/platform-root -n argocd --timeout=300s || true

          echo "Current Argo CD applications:"
          kubectl get application -n argocd || true

          echo "Current Argo CD projects:"
          kubectl get appproject -n argocd || true
