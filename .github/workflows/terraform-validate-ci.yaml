# -------------------------------------------------------------------
# PURPOSE:
# Validate Terraform configuration before infrastructure provisioning.
#
# RESPONSIBILITIES:
# - terraform fmt validation
# - terraform init without backend
# - terraform validate
#
# WHY THIS EXISTS?
# Prevent broken Terraform code from reaching infra-main apply stage.
#
# DESIGN:
# - lightweight
# - reusable via workflow_call
# - no infrastructure changes
# - safe for PR validation
# -------------------------------------------------------------------
name: terraform-validate-ci

on:
  workflow_call:

  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate-ci.yaml"

  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate-ci.yaml"

jobs:
  terraform-validate-ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform fmt check
        working-directory: terraform/live/main
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform/live/main
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/live/main
        run: terraform validate

      - name: Block committed Terraform generated files
        run: |
          PATTERN='(^|/)(tfplan[^/]*|.*\.tfplan|terraform\.tfstate|crash\.log)'

          GENERATED_FILES=$(
            git ls-files | grep -E "$PATTERN" || true
          )

          if [ -n "$GENERATED_FILES" ]; then
            echo "Generated Terraform files found:"
            echo "$GENERATED_FILES"
            exit 1
          fi
