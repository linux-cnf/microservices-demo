# -------------------------------------------------------------------
# PURPOSE:
# Vulnerability and misconfiguration scanning.
#
# SCANS:
# - Filesystem
# - Terraform
# - Kubernetes manifests
# - Secrets
# - Misconfigurations
#
# WHY?
# Detect security weaknesses across the platform repository.
#
# EXECUTION:
# Called by devsecops-security-scan.yml
# -------------------------------------------------------------------

name: security-trivy

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
