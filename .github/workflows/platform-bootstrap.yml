# -------------------------------------------------------------------
# PURPOSE:
# High-level orchestration workflow for platform bootstrap.
#
# RESPONSIBILITIES:
# - Provision infrastructure
# - Mirror approved platform images into Artifact Registry
# - Prepare the platform for private-cluster GitOps bootstrap
#
# WHY THIS EXISTS?
# Private GKE nodes running without Cloud NAT cannot pull directly
# from public registries such as:
# - quay.io
# - ghcr.io
# - docker.io
# - public.ecr.aws
#
# Therefore:
# 1. Infrastructure must exist first
# 2. Artifact Registry repositories must exist
# 3. Required platform images must be mirrored internally
# 4. Only then can cluster bootstrap succeed reliably
#
# EXECUTION FLOW:
# infra-main
#   ↓
# mirror-platform-images
#
# FUTURE PLATFORM FLOW:
# platform-bootstrap
#   ├── infra-main
#   ├── mirror-platform-images
#   ├── cluster-bootstrap
#   ├── observability-bootstrap
#   └── smoke-tests
#
# BENEFITS:
# - deterministic platform bootstrap
# - no random public image pulls
# - production-friendly private-node architecture
# - reusable workflow composition
# - reduced dependency on public registries
#
# In short:
# bootstrap infra first, mirror trusted images second,
# then deploy workloads safely into private GKE.
# -------------------------------------------------------------------
name: platform-bootstrap

on:
  workflow_dispatch:
    inputs:
      run_terraform_validate:
        description: "Run terraform validation?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      run_github_governance:
        description: "Apply GitHub governance controls?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      run_infra:
        description: "Run infra-main workflow?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      run_apply:
        description: "Run terraform apply?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      run_mirror_platform_images:
        description: "Mirror platform images?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  terraform-validate:
    if: ${{ inputs.run_terraform_validate == 'true' }}
    uses: ./.github/workflows/terraform-validate-ci.yaml
    secrets: inherit

  github-governance:
    if: ${{ !cancelled() && inputs.run_github_governance == 'true' }}
    needs: terraform-validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/live/github-governance

    env:
      GITHUB_TOKEN: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init - GitHub governance
        run: terraform init -input=false

      - name: Terraform validate - GitHub governance
        run: terraform validate

      - name: Terraform plan - GitHub governance
        run: terraform plan -input=false

      - name: Terraform apply - GitHub governance
        run: terraform apply -input=false -auto-approve

  infra:
    if: ${{ !cancelled() && inputs.run_infra == 'true' }}
    needs: terraform-validate
    uses: ./.github/workflows/infra-main.yml
    with:
      run_apply: ${{ inputs.run_apply }}
    secrets: inherit

  mirror-platform-images:
    if: ${{ !cancelled() && inputs.run_mirror_platform_images == 'true' }}
    needs: infra
    uses: ./.github/workflows/mirror-platform-images.yml
    secrets: inherit

  bootstrap-complete-message:
    name: Bootstrap completion message
    needs:
      - terraform-validate
      - github-governance
      - infra
      - mirror-platform-images
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Print next-step instructions
        run: |
          echo "✅ Platform bootstrap completed."
          echo ""
          echo "Infra for app workloads and platform observability has been provisioned."
          echo ""
          echo "Now deploy the serving/application layer from this microservices repo:"
          echo ""
          echo "  ./scripts/cluster-bootstrap.sh"
          echo ""
          echo "NOTE:"
          echo "Run this script from the bastion node or from the machine/IP range whitelisted in GKE master authorized networks."
          echo ""
          echo "Current whitelisted CIDR:"
          echo "  163.227.186.128/30"
