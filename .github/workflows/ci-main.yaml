name: "Continuous Integration - Main/Release"

on:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**/README.md'
      - 'kustomize/**'
      - '.github/workflows/kustomize-build-ci.yaml'
      - 'terraform/**'
      - '.github/workflows/terraform-validate-ci.yaml'
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-ci.yaml'
      - '.github/workflows/infra-destroy.yml'
      - 'argocd/**'

permissions:
  contents: write # write is needed because workflow will commit and push file changes
  id-token: write # write is still useful for GCP auth in image build/push job 
jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ./.dotnet
        with:
          dotnet-version: '10.0'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Go Unit Tests
        timeout-minutes: 10
        run: |
          for SERVICE in shippingservice productcatalogservice; do
            echo "testing $SERVICE..."
            pushd src/$SERVICE
            go test ./...
            popd
          done

      - name: C# Unit Tests
        timeout-minutes: 10
        run: |
          dotnet test src/cartservice/

  manifest-validation:
    runs-on: ubuntu-latest
    needs: code-tests
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kustomize base renders successfully
        run: |
          kubectl kustomize kustomize > /tmp/boutique-rendered.yaml
          test -s /tmp/boutique-rendered.yaml

  build-and-push-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs:
      - code-tests
      - manifest-validation

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push service images
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          REGISTRY="us-central1-docker.pkg.dev/${PROJECT_ID}/microservices-demo"
          TAG="${GITHUB_SHA}"

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
            shoppingassistantservice
          )

          for service in "${SERVICES[@]}"; do
            if [ "${service}" = "cartservice" ]; then
              DOCKERFILE="src/cartservice/src/Dockerfile"
              CONTEXT="src/cartservice/src"
            else
              DOCKERFILE="src/${service}/Dockerfile"
              CONTEXT="src/${service}"
            fi

            if [ ! -f "${DOCKERFILE}" ]; then
              echo "Skipping ${service}: Dockerfile not found at ${DOCKERFILE}"
              continue
            fi

            IMAGE="${REGISTRY}/${service}:${TAG}"

            echo "Building ${IMAGE}"
            #docker build -t "${IMAGE}" "src/${service}"
            docker build -f "${DOCKERFILE}" -t "${IMAGE}" "${CONTEXT}"

            echo "Pushing ${IMAGE}"
            docker push "${IMAGE}"
          done

