# IMPORTANT:
# This workflow is the main CI pipeline for application container images.
#
# Purpose:
# - Detect changed microservices from src/<service>/ changes.
# - Detect shared changes that can impact all services.
# - Run code tests and validate rendered Kustomize manifests.
# - Build and push required service images to Artifact Registry.
# - Open an automated PR updating image tags in:
#   kustomize/components/container-images-tag/kustomization.yaml
# - Additionally update kustomize/base/frontend.yaml for frontend Rollout.
---
name: "Continuous Integration :- Main/Release"

"on":
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - "**/README.md"
      - ".github/workflows/kustomize-build-ci.yaml"
      - "terraform/**"
      - ".github/workflows/terraform-validate-ci.yaml"
      - "helm-chart/**"
      - ".github/workflows/helm-chart-ci.yaml"
      - ".github/workflows/platform-full-destroy.yml"
      - "argocd/**"
      - "docs/**"
      - "scripts/**"

      # AI platform
      - "src/ai*/**"
      - "kustomize/ai-platform/**"
      - ".github/workflows/ai-*.yml"
      - ".github/workflows/ai-*.yaml"

      # Existing GitOps image tag PRs
      - "kustomize/components/container-images-tag/kustomization.yaml"
      - "kustomize/base/frontend.yaml"

  workflow_dispatch:
    inputs:
      rebuild_missing_images:
        description: "DR mode: check Artifact Registry and rebuild missing images for this Git SHA"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: update-tags-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  REGISTRY_REGION: us-central1
  IMAGE_REPOSITORY: microservices-demo
  TAG_FILE: kustomize/components/container-images-tag/kustomization.yaml

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_service_changes: ${{ steps.detect.outputs.has_service_changes }}
      shared_changed: ${{ steps.detect.outputs.shared_changed }}
      missing_images: ${{ steps.detect.outputs.missing_images }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Detect changed files, services, and missing images
        id: detect
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REBUILD_MISSING_IMAGES: ${{ github.event.inputs.rebuild_missing_images || 'false' }}
        run: |
          set -euo pipefail

          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          echo "Before SHA: ${BEFORE_SHA}"
          echo "Current SHA: ${CURRENT_SHA}"
          echo "Rebuild missing images: ${REBUILD_MISSING_IMAGES}"

          if [[ -z "${BEFORE_SHA}" ]] || \
             [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No valid before SHA found. Falling back to previous commit if available."
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              DIFF_FILES="$(git diff --name-only HEAD^ HEAD)"
            else
              DIFF_FILES="$(git ls-files)"
            fi
          else
            DIFF_FILES="$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")"
          fi

          echo "Changed files:"
          echo "${DIFF_FILES}"

          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          declare -a CHANGED_SERVICES=()
          SHARED_CHANGED="false"
          MISSING_IMAGES="false"

          for service in "${SERVICES[@]}"; do
            if echo "${DIFF_FILES}" | grep -qE "^src/${service}/"; then
              CHANGED_SERVICES+=("${service}")
            fi
          done

          SHARED_REGEX='^(proto/|pb/|genproto/|Dockerfile|Makefile)'

          if echo "${DIFF_FILES}" | grep -qE "${SHARED_REGEX}"; then
            SHARED_CHANGED="true"
            CHANGED_SERVICES=("${SERVICES[@]}")
          fi

          REGISTRY="${REGISTRY_REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_REPOSITORY}"

          if [[ "${REBUILD_MISSING_IMAGES}" == "true" ]]; then
            echo "DR mode enabled. Checking Artifact Registry for all expected images."

            for service in "${SERVICES[@]}"; do
              IMAGE="${REGISTRY}/${service}:${CURRENT_SHA}"

              echo "Checking image: ${IMAGE}"

              if ! gcloud artifacts docker images describe "${IMAGE}" >/dev/null 2>&1; then
                echo "Missing image detected: ${IMAGE}"
                MISSING_IMAGES="true"
                CHANGED_SERVICES+=("${service}")
              else
                echo "Image already exists: ${IMAGE}"
              fi
            done
          else
            echo "DR mode disabled. Skipping global missing-image scan."
          fi

          if [[ ${#CHANGED_SERVICES[@]} -gt 0 ]]; then
            mapfile -t UNIQUE_CHANGED_SERVICES < <(
              printf "%s\n" "${CHANGED_SERVICES[@]}" | sort -u
            )
          else
            UNIQUE_CHANGED_SERVICES=()
          fi

          if [[ ${#UNIQUE_CHANGED_SERVICES[@]} -eq 0 ]]; then
            echo "No service changes or missing images detected."
            echo 'services=[]' >> "$GITHUB_OUTPUT"
            echo 'has_service_changes=false' >> "$GITHUB_OUTPUT"
          else
            JSON="$(
              printf '%s\n' "${UNIQUE_CHANGED_SERVICES[@]}" |
              jq -R . |
              jq -cs .
            )"
            echo "Services selected for build: ${JSON}"
            echo "services=${JSON}" >> "$GITHUB_OUTPUT"
            echo 'has_service_changes=true' >> "$GITHUB_OUTPUT"
          fi

          echo "shared_changed=${SHARED_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "missing_images=${MISSING_IMAGES}" >> "$GITHUB_OUTPUT"

  code-tests:
    name: Code Tests
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ./.dotnet
        with:
          dotnet-version: "10.0"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Go Unit Tests
        timeout-minutes: 10
        run: |
          set -euo pipefail

          for SERVICE in shippingservice productcatalogservice; do
            echo "testing $SERVICE..."
            pushd "src/$SERVICE"
            go test ./...
            popd
          done

      - name: C# Unit Tests
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dotnet test src/cartservice/

  manifest-validation:
    name: Manifest Validation
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - code-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kustomize base renders successfully
        run: |
          set -euo pipefail
          kubectl kustomize kustomize > /tmp/boutique-rendered.yaml
          test -s /tmp/boutique-rendered.yaml

  build-and-push-images:
    name: Build and Push Changed Images
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - code-tests
      - manifest-validation
    if: needs.detect-changes.outputs.has_service_changes == 'true'

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.REGISTRY_REGION }}-docker.pkg.dev \
            --quiet

      - name: Build and push changed service image
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          REGISTRY="${REGISTRY_REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_REPOSITORY}"
          TAG="${GITHUB_SHA}"

          if [[ "${SERVICE}" == "cartservice" ]]; then
            DOCKERFILE="src/cartservice/src/Dockerfile"
            CONTEXT="src/cartservice/src"
          else
            DOCKERFILE="src/${SERVICE}/Dockerfile"
            CONTEXT="src/${SERVICE}"
          fi

          if [[ ! -f "${DOCKERFILE}" ]]; then
            echo "Skipping ${SERVICE}: Dockerfile not found at ${DOCKERFILE}"
            exit 0
          fi

          IMAGE="${REGISTRY}/${SERVICE}:${TAG}"

          echo "Checking whether image already exists: ${IMAGE}"
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Image already exists. Skipping build/push for ${IMAGE}"
            exit 0
          fi

          echo "Building ${IMAGE}"
          docker build -f "${DOCKERFILE}" -t "${IMAGE}" "${CONTEXT}"

          echo "Pushing ${IMAGE}"
          docker push "${IMAGE}"

  update-kustomize-tags:
    name: Update Kustomize Tags
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-push-images
    if: needs.detect-changes.outputs.has_service_changes == 'true'

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          sudo wget -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
          jq --version

      - name: Update only changed service tags to current Git SHA
        shell: bash
        env:
          CHANGED_SERVICES_JSON: ${{ needs.detect-changes.outputs.services }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_SHA}"
          REGISTRY="${REGISTRY_REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_REPOSITORY}"

          if [[ ! -f "${TAG_FILE}" ]]; then
            echo "Tag file not found: ${TAG_FILE}"
            exit 1
          fi

          echo "Before component tag update:"
          cat "${TAG_FILE}"

          mapfile -t CHANGED_SERVICES < <(
            echo "${CHANGED_SERVICES_JSON}" | jq -r '.[]'
          )

          for service in "${CHANGED_SERVICES[@]}"; do
            echo "Updating service: ${service}"

            COMPONENT_IMAGE_NAME="us-central1-docker.pkg.dev/google-samples/microservices-demo/${service}"

            echo "Updating component image tag:"
            echo "  image: ${COMPONENT_IMAGE_NAME}"
            echo "  tag:   ${TAG}"

            yq -i '
              (.images[] | select(.name == "'"${COMPONENT_IMAGE_NAME}"'").newTag) = "'"${TAG}"'"
            ' "${TAG_FILE}"

            if [[ "${service}" == "frontend" ]]; then
              export FRONTEND_IMAGE="${REGISTRY}/${service}:${TAG}"

              yq -i '
                (select(.kind == "Rollout" and .metadata.name == "frontend")
                  .spec.template.spec.containers[] | select(.name == "server").image) = strenv(FRONTEND_IMAGE)
              ' kustomize/base/frontend.yaml
            fi
          done

          echo "After component tag update:"
          cat "${TAG_FILE}"

          echo "Diff:"
          git diff -- "${TAG_FILE}" kustomize/base/frontend.yaml || true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate final Kustomize render after tag update
        run: |
          set -euo pipefail
          kubectl kustomize kustomize > /tmp/boutique-final-rendered.yaml
          test -s /tmp/boutique-final-rendered.yaml

      - name: Check whether tag files actually changed
        id: git-check
        run: |
          set -euo pipefail

          if git diff --quiet -- "${TAG_FILE}" kustomize/base/frontend.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No tag changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Tag files changed."
          fi

      - name: Create pull request for updated image tags
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: update changed image tags to ${GITHUB_SHA}"
          branch: "bot/update-image-tags-${{ github.ref_name }}"
          delete-branch: true
          title: "ci: update changed image tags to ${{ github.sha }}"
          body: |
            Automated image tag update generated by GitHub Actions.

            Updated image tags only for selected services to `${{ github.sha }}`.

            Frontend Rollout image is also updated in `kustomize/base/frontend.yaml`
            when frontend changes are detected.

            Source workflow: `${{ github.workflow }}`
            Source commit: `${{ github.sha }}`
          base: ${{ github.ref_name }}
          add-paths: |
            kustomize/components/container-images-tag/kustomization.yaml
            kustomize/base/frontend.yaml
