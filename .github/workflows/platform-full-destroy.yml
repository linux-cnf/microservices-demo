# -------------------------------------------------------------------
# RESPONSIBILITIES:
# - Remove GKE cluster resources
# - Remove managed node pools
# - Remove Cloud NAT resources
# - Clean up orphaned GKE/PVC disks
# - Report leftover static IPs for manual review
#
# WHY THIS EXISTS?
# Provides a controlled teardown workflow for lab,
# testing, and cost-optimization scenarios while
# protecting long-lived resources such as:
# - Artifact Registry
# - Secret Manager
# - Service Accounts
# - Terraform state
#
# SAFETY MODEL:
# Requires explicit confirmation before execution.
# Uses Terraform-managed destruction only for
# approved infrastructure components.
#
# In short:
# Destroy Kubernetes infrastructure safely without
# impacting shared platform resources.
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# PURPOSE:
# Safely decommission infrastructure created by Terraform.
# -------------------------------------------------------------------
name: platform-full-destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type yes-destroy-entire-platform to confirm"
        required: true
        default: "no"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-live-main
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirm_destroy == 'yes-destroy-entire-platform' }}
    runs-on: ubuntu-latest
    environment: production-destroy

    defaults:
      run:
        working-directory: terraform/live/main

    env:
      TF_INPUT: "false"
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      GKE_CLUSTER: kfounding
      GKE_REGION: us-central1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Pre-delete GKE node pools safely
        run: |
          set +e

          echo "Checking if cluster exists..."
          if ! gcloud container clusters describe "$GKE_CLUSTER" \
            --region "$GKE_REGION" \
            --project "$TF_VAR_gcp_project_id" >/dev/null 2>&1; then
            echo "Cluster does not exist. Skipping node pool cleanup."
            exit 0
          fi

          for NODE_POOL in primary-node-pool platform-observability ai-node-pool default-pool; do
            echo "Checking node pool: $NODE_POOL"

            if gcloud container node-pools describe "$NODE_POOL" \
              --cluster "$GKE_CLUSTER" \
              --region "$GKE_REGION" \
              --project "$TF_VAR_gcp_project_id" >/dev/null 2>&1; then

              echo "Deleting node pool through gcloud first: $NODE_POOL"

              gcloud container node-pools delete "$NODE_POOL" \
                --cluster "$GKE_CLUSTER" \
                --region "$GKE_REGION" \
                --project "$TF_VAR_gcp_project_id" \
                --quiet || true
            else
              echo "Node pool not found: $NODE_POOL"
            fi
          done

          echo "Waiting for GKE/MIG reconciliation..."
          sleep 300

      - name: Remove pre-deleted node pools from Terraform state
        run: |
          terraform state rm module.gke_node_pool.google_container_node_pool.primary_nodes || true
          terraform state rm module.gke_node_pool_platform_observability.google_container_node_pool.primary_nodes || true
          terraform state rm module.ai_node_pool.google_container_node_pool.primary_nodes || true

      - name: Terraform Destroy GKE and NAT only
        run: |
          terraform destroy -input=false -auto-approve \
            -target=module.gke_cluster \
            -target=module.cloud_nat.google_compute_router_nat.this \
            -target=module.cloud_nat.google_compute_router.this

      - name: Delete orphan GKE disks
        if: ${{ !cancelled() }}
        run: |
          echo "Finding unattached GKE/PVC disks..."

          DISK_FILTER="(name~'^pvc-' OR name~'^gke-kfounding-default-pool-'"
          DISK_FILTER="${DISK_FILTER} OR name~'^gke-kfounding-primary-node-pool-'"
          DISK_FILTER="${DISK_FILTER} OR name~'^gke-kfounding-platform-observability-'"
          DISK_FILTER="${DISK_FILTER} OR name~'^gke-kfounding-ai-node-pool-')"
          DISK_FILTER="${DISK_FILTER} AND -users:*"

          gcloud compute disks list \
            --project="${TF_VAR_gcp_project_id}" \
            --filter="${DISK_FILTER}" \
            --format="csv[no-heading](name,zone.basename())" | while IFS=, read -r DISK ZONE; do

              [ -z "$DISK" ] && continue
              [ -z "$ZONE" ] && continue

              echo "Deleting orphan disk: $DISK ($ZONE)"

              gcloud compute disks delete "$DISK" \
                --project="${TF_VAR_gcp_project_id}" \
                --zone "$ZONE" \
                --quiet || true
            done

      - name: Check leftover static IPs
        if: ${{ !cancelled() }}
        run: |
          echo "=== Regional Static IPs ==="
          gcloud compute addresses list \
            --project="${TF_VAR_gcp_project_id}" \
            --format="table(name,address,status,region,purpose)"

          echo "=== Global Static IPs ==="
          gcloud compute addresses list \
            --project="${TF_VAR_gcp_project_id}" \
            --global \
            --format="table(name,address,status,purpose)"
