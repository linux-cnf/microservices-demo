# -------------------------------------------------------------------
# PURPOSE:
# Cost optimization workflow for AI platform infrastructure.
#
# RESPONSIBILITIES:
# - Disable the dedicated AI node pool using Terraform
# - Remove only AI infrastructure, not the main GKE platform
# - Keep AI cost controlled when LLM/agent workloads are not required
#
# SAFETY MODEL:
# This workflow does not destroy the full platform.
# It only applies Terraform with enable_ai_node_pool=false.
#
# CURRENT SCOPE:
# AI node pool is enabled only for prod.
# Future dev AI infra can be added by extending the environment options.
# -------------------------------------------------------------------

name: ai-nodepool-disable

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for AI node pool cleanup"
        required: true
        default: "prod"
        type: choice
        options:
          - prod

      confirm_destroy:
        description: "Type yes-disable-ai-node-pool-only to confirm"
        required: true
        default: "no"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-live-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ai-destroy:
    if: ${{ inputs.confirm_destroy == 'yes-disable-ai-node-pool-only' }}
    runs-on: ubuntu-latest

    env:
      TF_INPUT: "false"
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      SELECTED_ENVIRONMENT: ${{ inputs.environment }}
      TERRAFORM_WORKING_DIR: terraform/live/${{ inputs.environment }}
      CLUSTER_NAME: kfounding-prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

          echo "Plugin path:"
          which gke-gcloud-auth-plugin

          echo "Plugin version:"
          gke-gcloud-auth-plugin --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Guard - block AI cleanup after full platform destroy
        run: |
          set -euo pipefail

          if ! gcloud container clusters describe "${CLUSTER_NAME}" \
            --region us-central1 \
            --project "${TF_VAR_gcp_project_id}" >/dev/null 2>&1; then

            echo ""
            echo "❌ Cluster not found: ${CLUSTER_NAME}"
            echo "Full platform appears to have been destroyed."
            echo "AI node pool cleanup workflow cannot run."
            echo ""
            exit 1
          fi

          echo "✅ Cluster exists. Safe to continue with AI node pool cleanup."

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform plan disable AI node pool
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform plan -input=false -var="enable_ai_node_pool=false" -out=tfplan-ai-destroy

      - name: Terraform apply disable AI node pool
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan-ai-destroy

      - name: Verify AI node pool removed
        run: |
          set -euo pipefail

          echo "Checking node pools after AI cleanup..."
          gcloud container node-pools list \
            --cluster "${CLUSTER_NAME}" \
            --region us-central1 \
            --project "${TF_VAR_gcp_project_id}"

          echo ""
          echo "✅ Terraform cleanup completed."
          echo "AI node pool has been removed/disabled."
          echo ""
          echo "Note:"
          echo "Kubernetes node verification is skipped in GitHub Actions because"
          echo "the GKE control plane is accessible only from whitelisted networks/bastion."

      - name: AI node pool cleanup completion message
        run: |
          echo "✅ AI platform infrastructure cleanup completed."
          echo ""
          echo "Environment: ${SELECTED_ENVIRONMENT}"
          echo "Cluster: ${CLUSTER_NAME}"
          echo ""
          echo "Dedicated AI node pool has been disabled."
          echo "Core GKE platform, application node pools, observability, and networking remain untouched."
          echo ""
          echo "Cost-control status:"
          echo "  AI node pool: disabled"
          echo "  LLM/agent compute capacity: removed"
