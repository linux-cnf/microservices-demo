# -------------------------------------------------------------------
# PURPOSE:
# Build and publish the AI Agent Orchestrator container image.
#
# RESPONSIBILITIES:
# - Build ai-agent-orchestrator Docker image
# - Push immutable image tag to Artifact Registry
# - Update GitOps deployment manifest
# - Create PR with updated image tag
#
# GITOPS FLOW:
# Code change -> Build image -> Push image -> Update manifest PR -> Merge -> Argo CD deploys
#
# In short:
# CI builds the agent image, Git controls the deployed tag, Argo CD reconciles it.
# -------------------------------------------------------------------

name: ai-agent-orchestrator-ci

on:
  push:
    branches:
      - main
    paths:
      - "src/ai-agent-orchestrator/**"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  REGION: us-central1
  REPOSITORY: microservices-demo
  IMAGE_NAME: ai-agent-orchestrator

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            src/ai-agent-orchestrator

      - name: Push container image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker push "${IMAGE_URI}"

      - name: Update GitOps deployment manifest
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          sed -i "s|image: .*ai-agent-orchestrator:.*|image: ${IMAGE_URI}|g" \
            kustomize/ai-platform/base/ai-agent-orchestrator-deployment.yaml

          grep "image:" kustomize/ai-platform/base/ai-agent-orchestrator-deployment.yaml

      - name: Create image update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-ai-agent-orchestrator-image-${{ github.sha }}
          commit-message: "chore(ai): update ai agent orchestrator image"
          title: "chore(ai): update ai agent orchestrator image"
          body: |
            ## AI Agent Orchestrator Image Update

            Automated GitOps image update.

            Image tag:
            `${{ github.sha }}`

            Image repository:
            `${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}`

            Workflow:
            Build → Push → Git Update → Argo CD Deploy
          add-paths: |
            kustomize/ai-platform/base/ai-agent-orchestrator-deployment.yaml

      - name: Print deployment summary
        run: |
          echo "✅ AI Agent Orchestrator image built and pushed."
          echo "GitOps deployment PR created."
