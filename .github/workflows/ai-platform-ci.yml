# -------------------------------------------------------------------
# PURPOSE:
# CI/CD workflow for AI platform microservices.
#
# RESPONSIBILITIES:
# - Detect changed AI microservices from src/<service>/ changes
# - Run Python syntax checks for changed AI services
# - Validate AI Kustomize manifests
# - Build and push AI service images to Artifact Registry
# - Update normal Deployment or canary Rollout image based on toggle
# - Update Argo CD app path based on deployment mode
# - Open automated GitOps PR
#
# DEPLOYMENT MODES:
# - normal: updates base Deployment and Argo CD path to base
# - canary: updates rollout Rollout and Argo CD path to rollout
#
# In short:
# Pipeline-controlled AI deployment strategy toggle.
# -------------------------------------------------------------------

name: ai-platform-ci

on:
  push:
    branches:
      - main
    paths:
      - "src/ai-llm-gateway/**"
      - "src/ai-agent-orchestrator/**"
      - ".github/workflows/ai-platform-ci.yml"

  workflow_dispatch:
    inputs:
      build_llm_gateway:
        description: "Build ai-llm-gateway?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      build_ai_agent_orchestrator:
        description: "Build ai-agent-orchestrator?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      deployment_mode:
        description: "AI deployment mode"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - canary

concurrency:
  group: update-tags-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  REGION: us-central1
  REPOSITORY: ai-microservices
  AI_ARGO_APP: argocd/apps/ai-platform.yaml

jobs:
  detect-changes:
    name: Detect changed AI services
    runs-on: ubuntu-latest

    outputs:
      llm_gateway_changed: ${{ steps.detect.outputs.llm_gateway_changed }}
      ai_agent_orchestrator_changed: ${{ steps.detect.outputs.ai_agent_orchestrator_changed }}
      any_ai_service_changed: ${{ steps.detect.outputs.any_ai_service_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed AI microservices
        id: detect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LLM_GATEWAY_CHANGED="${{ inputs.build_llm_gateway }}"
            AI_AGENT_ORCHESTRATOR_CHANGED="${{ inputs.build_ai_agent_orchestrator }}"
          else
            CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD)"

            echo "Changed files:"
            echo "${CHANGED_FILES}"

            LLM_GATEWAY_CHANGED="false"
            AI_AGENT_ORCHESTRATOR_CHANGED="false"

            if echo "${CHANGED_FILES}" | grep -q '^src/ai-llm-gateway/'; then
              LLM_GATEWAY_CHANGED="true"
            fi

            if echo "${CHANGED_FILES}" | grep -q '^src/ai-agent-orchestrator/'; then
              AI_AGENT_ORCHESTRATOR_CHANGED="true"
            fi
          fi

          ANY_AI_SERVICE_CHANGED="false"
          if [ "${LLM_GATEWAY_CHANGED}" = "true" ] || [ "${AI_AGENT_ORCHESTRATOR_CHANGED}" = "true" ]; then
            ANY_AI_SERVICE_CHANGED="true"
          fi

          {
            echo "llm_gateway_changed=${LLM_GATEWAY_CHANGED}"
            echo "ai_agent_orchestrator_changed=${AI_AGENT_ORCHESTRATOR_CHANGED}"
            echo "any_ai_service_changed=${ANY_AI_SERVICE_CHANGED}"
          } >> "${GITHUB_OUTPUT}"

          echo "ai-llm-gateway changed: ${LLM_GATEWAY_CHANGED}"
          echo "ai-agent-orchestrator changed: ${AI_AGENT_ORCHESTRATOR_CHANGED}"
          echo "any AI service changed: ${ANY_AI_SERVICE_CHANGED}"

  resolve-deployment-strategy:
    name: Resolve deployment strategy
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_ai_service_changed == 'true'

    outputs:
      deployment_mode: ${{ steps.resolve.outputs.deployment_mode }}
      kustomize_path: ${{ steps.resolve.outputs.kustomize_path }}
      llm_gateway_manifest: ${{ steps.resolve.outputs.llm_gateway_manifest }}

    steps:
      - name: Resolve AI deployment strategy
        id: resolve
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOYMENT_MODE="${{ inputs.deployment_mode }}"
          else
            DEPLOYMENT_MODE="normal"
          fi

          case "${DEPLOYMENT_MODE}" in
            normal)
              KUSTOMIZE_PATH="kustomize/ai-platform/base"
              LLM_GATEWAY_MANIFEST="kustomize/ai-platform/base/ai-llm-gateway-deployment.yaml"
              ;;
            canary)
              KUSTOMIZE_PATH="kustomize/ai-platform/rollout"
              LLM_GATEWAY_MANIFEST="kustomize/ai-platform/rollout/ai-llm-gateway-rollout.yaml"
              ;;
            *)
              echo "Unsupported deployment mode: ${DEPLOYMENT_MODE}"
              exit 1
              ;;
          esac

          {
            echo "deployment_mode=${DEPLOYMENT_MODE}"
            echo "kustomize_path=${KUSTOMIZE_PATH}"
            echo "llm_gateway_manifest=${LLM_GATEWAY_MANIFEST}"
          } >> "${GITHUB_OUTPUT}"

          echo "Deployment mode: ${DEPLOYMENT_MODE}"
          echo "Kustomize path: ${KUSTOMIZE_PATH}"
          echo "LLM Gateway manifest: ${LLM_GATEWAY_MANIFEST}"

  validate:
    name: Validate AI services and manifests
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - resolve-deployment-strategy
    if: needs.detect-changes.outputs.any_ai_service_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python syntax check - ai-llm-gateway
        if: needs.detect-changes.outputs.llm_gateway_changed == 'true'
        run: |
          python -m py_compile src/ai-llm-gateway/main.py

      - name: Python syntax check - ai-agent-orchestrator
        if: needs.detect-changes.outputs.ai_agent_orchestrator_changed == 'true'
        run: |
          python -m py_compile src/ai-agent-orchestrator/main.py

      - name: Validate AI Kustomize manifests
        run: |
          set -euo pipefail

          kubectl kustomize "${{ needs.resolve-deployment-strategy.outputs.kustomize_path }}" >/tmp/ai-platform-rendered.yaml

          echo "Deployment mode: ${{ needs.resolve-deployment-strategy.outputs.deployment_mode }}"
          echo "Rendered AI manifests:"
          grep -E "kind:|name:" /tmp/ai-platform-rendered.yaml | head -80

  build-and-push:
    name: Build and push AI images
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - resolve-deployment-strategy
      - validate
    if: needs.detect-changes.outputs.any_ai_service_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push ai-llm-gateway
        if: needs.detect-changes.outputs.llm_gateway_changed == 'true'
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/ai-llm-gateway:${GITHUB_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            src/ai-llm-gateway

          docker push "${IMAGE_URI}"

      - name: Build and push ai-agent-orchestrator
        if: needs.detect-changes.outputs.ai_agent_orchestrator_changed == 'true'
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          IMAGE_REGISTRY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}"

          IMAGE_URI="${IMAGE_REGISTRY}/ai-agent-orchestrator:${GITHUB_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            src/ai-agent-orchestrator

          docker push "${IMAGE_URI}"

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update GitOps image tags
        run: |
          set -euo pipefail

          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          IMAGE_REGISTRY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}"

          DEPLOYMENT_MODE="${{ needs.resolve-deployment-strategy.outputs.deployment_mode }}"
          export KUSTOMIZE_PATH="${{ needs.resolve-deployment-strategy.outputs.kustomize_path }}"
          LLM_GATEWAY_MANIFEST="${{ needs.resolve-deployment-strategy.outputs.llm_gateway_manifest }}"

          echo "Deployment mode: ${DEPLOYMENT_MODE}"
          echo "Kustomize path: ${KUSTOMIZE_PATH}"
          echo "LLM Gateway manifest: ${LLM_GATEWAY_MANIFEST}"

          yq -i '
            .spec.source.path = strenv(KUSTOMIZE_PATH)
          ' "${AI_ARGO_APP}"

          echo "Updated Argo CD AI application path:"
          grep "path:" "${AI_ARGO_APP}"

          if [ "${{ needs.detect-changes.outputs.llm_gateway_changed }}" = "true" ]; then
            export LLM_GATEWAY_IMAGE="${IMAGE_REGISTRY}/ai-llm-gateway:${GITHUB_SHA}"

            if [ "${DEPLOYMENT_MODE}" = "canary" ]; then
              yq -i '
                (select(.kind == "Rollout" and .metadata.name == "ai-llm-gateway")
                  .spec.template.spec.containers[] | select(.name == "ai-llm-gateway").image) = strenv(LLM_GATEWAY_IMAGE)
              ' "${LLM_GATEWAY_MANIFEST}"
            else
              yq -i '
                (select(.kind == "Deployment" and .metadata.name == "ai-llm-gateway")
                  .spec.template.spec.containers[] | select(.name == "ai-llm-gateway").image) = strenv(LLM_GATEWAY_IMAGE)
              ' "${LLM_GATEWAY_MANIFEST}"
            fi

            echo "Updated ai-llm-gateway image:"
            grep "image:" "${LLM_GATEWAY_MANIFEST}"
          fi

          if [ "${{ needs.detect-changes.outputs.ai_agent_orchestrator_changed }}" = "true" ]; then
            export AI_AGENT_IMAGE="${IMAGE_REGISTRY}/ai-agent-orchestrator:${GITHUB_SHA}"

            yq -i '
              (select(.kind == "Deployment" and .metadata.name == "ai-agent-orchestrator")
                .spec.template.spec.containers[] | select(.name == "ai-agent-orchestrator").image) = strenv(AI_AGENT_IMAGE)
            ' kustomize/ai-platform/base/ai-agent-orchestrator-deployment.yaml

            echo "Updated ai-agent-orchestrator image:"
            grep "image:" kustomize/ai-platform/base/ai-agent-orchestrator-deployment.yaml
          fi

      - name: Validate final AI Kustomize render
        run: |
          set -euo pipefail

          kubectl kustomize "${{ needs.resolve-deployment-strategy.outputs.kustomize_path }}" >/tmp/ai-platform-final.yaml
          test -s /tmp/ai-platform-final.yaml

      - name: Create GitOps image update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-ai-microservices-images-${{ github.sha }}
          commit-message: "chore(ai): update ai microservices image tags"
          title: "chore(ai): update AI microservices image tags"
          body: |
            ## AI Microservices Image Update

            Automated GitOps image update for AI platform microservices.

            Repository:
            `${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}`

            Image tag:
            `${{ github.sha }}`

            Deployment mode:
            ${{ needs.resolve-deployment-strategy.outputs.deployment_mode }}

            Argo CD path:
            `${{ needs.resolve-deployment-strategy.outputs.kustomize_path }}`

            Updated services:
            - ai-llm-gateway: `${{ needs.detect-changes.outputs.llm_gateway_changed }}`
            - ai-agent-orchestrator: `${{ needs.detect-changes.outputs.ai_agent_orchestrator_changed }}`

            Workflow:
            Detect → Resolve Strategy → Validate → Build → Push → Git Update → Argo CD Deploy

            Generated automatically by ai-platform-ci.
          add-paths: |
            argocd/apps/ai-platform.yaml
            kustomize/ai-platform/base/ai-llm-gateway-deployment.yaml
            kustomize/ai-platform/base/ai-agent-orchestrator-deployment.yaml
            kustomize/ai-platform/rollout/ai-llm-gateway-rollout.yaml

      - name: Print deployment summary
        run: |
          echo "✅ AI microservices CI completed."
          echo ""
          echo "Deployment mode:"
          echo "${{ needs.resolve-deployment-strategy.outputs.deployment_mode }}"
          echo ""
          echo "Argo CD path:"
          echo "${{ needs.resolve-deployment-strategy.outputs.kustomize_path }}"
          echo ""
          echo "Artifact Registry repository:"
          echo "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}"
          echo ""
          echo "GitOps image update PR created."
          echo "Merge the PR to allow Argo CD to deploy updated AI images."
