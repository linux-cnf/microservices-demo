name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type yes-destroy-kfounding to confirm"
        required: true
        default: "no"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-live-main
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirm_destroy == 'yes-destroy-kfounding' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/live/main

    env:
      TF_INPUT: "false"
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy GKE and NAT only
        run: |
          terraform destroy -input=false -auto-approve \
            -target=module.gke_node_pool \
            -target=module.gke_node_pool_platform_observability \
            -target=module.gke_cluster \
            -target=module.cloud_nat.google_compute_router_nat.this \
            -target=module.cloud_nat.google_compute_router.this

      - name: Delete orphan GKE disks
        if: always()
        run: |
          echo "Finding orphan PVC/default-pool disks..."

          gcloud compute disks list \
            --filter="name~'^pvc-' OR name~'^gke-kfounding-default-pool-'" \
            --format="csv[no-heading](name,zone.basename())" | while IFS=, read -r DISK ZONE; do

              if [ -z "$DISK" ] || [ -z "$ZONE" ]; then
                continue
              fi

              echo "Deleting PVC disk: $DISK in $ZONE"
              gcloud compute disks delete "$DISK" \
                --zone "$ZONE" \
                --quiet
            done

      - name: Check leftover static IPs
        if: always()
        run: |
          echo "=== Regional Static IPs ==="
          gcloud compute addresses list \
            --format="table(name,address,status,region,purpose)"

          echo "=== Global Static IPs ==="
          gcloud compute addresses list --global \
            --format="table(name,address,status,purpose)"
