name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type yes-destroy-kfounding to confirm"
        required: true
        default: "no"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-live-main
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirm_destroy == 'yes-destroy-kfounding' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/live/main

    env:
      TF_INPUT: "false"
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy GKE only
        run: |
          terraform destroy -input=false -auto-approve \
            -target=module.gke_node_pool \
            -target=module.gke_cluster
