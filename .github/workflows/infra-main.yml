# # -------------------------------------------------------------------
# PURPOSE:
# Provision and validate core cloud infrastructure using Terraform
# from GitHub-hosted runners.
#
# RESPONSIBILITIES:
# - Enable required GCP APIs
# - Create VPC/subnet/networking
# - Create Artifact Registry repositories
# - Create GKE cluster and node pools
# - Validate Terraform configuration
# - Export PV -> GCP disk mapping artifact
#
# DESIGN PRINCIPLES:
# - Infrastructure only (no kubectl app bootstrap here)
# - Reusable workflow via workflow_call
# - Safe for orchestration from higher-level workflows
# - Keeps cloud provisioning separate from cluster bootstrap
#
# WHY SEPARATED?
# Cluster-level operations such as:
# - Argo CD installation
# - kubectl apply
# - GitOps bootstrap
# - workload deployment
#
# are intentionally handled separately from bastion/bootstrap
# workflows because private GKE clusters may not be reachable from
# GitHub-hosted runners.
#
# LONG-TERM PLATFORM FLOW:
# platform-bootstrap
#   ├── infra-main
#   ├── mirror-platform-images
#   ├── cluster-bootstrap
#   ├── observability-bootstrap
#   └── smoke-tests
#
# In short:
# Terraform provisions infrastructure.
# GitOps/bootstrap layers are handled separately afterward.
# -------------------------------------------------------------------
# This workflow is responsible only for infrastructure provisioning and
# validation from GitHub-hosted runners using Terraform.
name: infra-main

on:
  workflow_call:
    inputs:
      run_apply:
        required: false
        type: string
        default: "true"

  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/map-pv-disks.sh"
      - ".github/workflows/infra-main.yml"

  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply?"
        required: true
        default: "false"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-live-main
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest

    env:
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud auth list
          gcloud config list
          gcloud projects describe "${{ secrets.GCP_PROJECT_ID }}" --format="value(projectNumber)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform init
        working-directory: terraform/live/main
        run: terraform init

      # Prevents Terraform failures when long-lived resources already exist
      # outside Terraform state. Automatically imports existing resources
      # (e.g., Secret Manager secrets and service accounts) to avoid duplicate creation errors.
      - name: Import long-lived existing Terraform resources
        working-directory: terraform/live/main
        env:
          TF_INPUT: "false"
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          SECRET_RESOURCE="google_secret_manager_secret.argocd_slack_bot_token"
          SECRET_ID="projects/${PROJECT_ID}/secrets/argocd-slack-bot-token"

          EXTERNAL_SECRETS_SA_RESOURCE="module.external_secrets_gsm_sa.google_service_account.service_account"
          EXTERNAL_SECRETS_SA_ID="projects/${PROJECT_ID}/serviceAccounts/external-secrets-gsm@${PROJECT_ID}.iam.gserviceaccount.com"

          if gcloud secrets describe argocd-slack-bot-token --project="${PROJECT_ID}" >/dev/null 2>&1; then
            if terraform state show "${SECRET_RESOURCE}" >/dev/null 2>&1; then
              echo "Secret Manager secret already exists in Terraform state."
            else
              echo "Importing existing Secret Manager secret into Terraform state..."
              terraform import "${SECRET_RESOURCE}" "${SECRET_ID}"
            fi
          else
            echo "Secret Manager secret does not exist yet. Terraform will create secret metadata."
          fi

          if gcloud iam service-accounts describe "external-secrets-gsm@${PROJECT_ID}.iam.gserviceaccount.com" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            if terraform state show "${EXTERNAL_SECRETS_SA_RESOURCE}" >/dev/null 2>&1; then
              echo "External Secrets service account already exists in Terraform state."
            else
              echo "Importing existing External Secrets service account into Terraform state..."
              terraform import "${EXTERNAL_SECRETS_SA_RESOURCE}" "${EXTERNAL_SECRETS_SA_ID}"
            fi
          else
            echo "External Secrets service account does not exist yet. Terraform will create it."
          fi

      - name: Terraform fmt check
        working-directory: terraform/live/main
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform/live/main
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/live/main
        env:
          TF_INPUT: "false"
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: inputs.run_apply == 'true'
        working-directory: terraform/live/main
        env:
          TF_INPUT: "false"
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Get GKE credentials
        if: inputs.run_apply == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: kfounding
          location: us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Creates a Kubernetes PV → GCP Persistent Disk inventory for troubleshooting,
      # backup, disaster recovery, and safe infrastructure cleanup by identifying
      # which cloud disks are actively used by Stateful workloads.
      # Generates PV-to-GCP disk mapping for stateful workload visibility,
      - name: Map Kubernetes PVs to GCP disks
        if: inputs.run_apply == 'true'
        continue-on-error: true
        run: |
          chmod +x scripts/map-pv-disks.sh
          ./scripts/map-pv-disks.sh | tee pv-disk-map.txt

      - name: Upload PV disk map artifact
        if: inputs.run_apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pv-disk-map
          path: pv-disk-map.txt
